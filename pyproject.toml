[project]
name = "anki-chinese"
version = "0.1.0"
description = "Generate Anki decks for learning Mandarin/Cantonese Chinese with Heisig RSH method"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "genanki>=0.13.0",
    "pypinyin>=0.53.0",
    "pycantonese>=3.4.0",
    "tojyutping>=0.3.0",
    "azure-cognitiveservices-speech>=1.40.0",
    "typer>=0.15.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "setuptools>=82.0.0",
]

[project.scripts]
anki-chinese = "anki_chinese.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_chinese"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "main.py", "_smoke_test.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
]
