[project]
name = "anki-chinese"
version = "0.1.0"
description = "Generate Anki decks for learning Mandarin/Cantonese Chinese with Heisig RSH method"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "genanki>=0.13.0",
    "pypinyin>=0.53.0",
    "pycantonese>=3.4.0",
    "tojyutping>=0.3.0",
    "typer>=0.15.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "setuptools>=82.0.0",
    "google-auth>=2.0.0",
    "google-genai>=1.68.0",
    "zstandard>=0.23.0",
]

[project.scripts]
anki-chinese = "anki_chinese.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_chinese"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "opencc-python-reimplemented>=0.1.7",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # use ternary (often less readable)
    "B008",   # function-call-in-default-argument (standard typer pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["anki_chinese"]
