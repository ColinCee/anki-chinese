<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中文 Tutor</title>
<style>
:root{--bg:#f5f7f6;--surface:#fff;--side:#eef2f1;--fg:#1b2422;--muted:#62716d;--line:#d8e1de;--accent:#16786a;--accent-soft:#e1f1ed;--user:#e9eef6;--han:"Noto Sans SC","PingFang SC","Microsoft YaHei UI",sans-serif;--body:"Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101615;--surface:#172020;--side:#131b1a;--fg:#e3ebe9;--muted:#93a39f;--line:#2b3936;--accent:#5cc4b2;--accent-soft:#1c332e;--user:#1d2633;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--body);display:flex}
aside{width:270px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .top{padding:12px;display:flex;flex-direction:column;gap:10px}
aside h1{font:300 22px var(--han);margin:0 4px}
#newchat{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;text-align:left}
#chats{list-style:none;margin:0;padding:4px 8px 12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
#chats button{font-weight:300;width:100%;border:0;background:transparent;color:var(--fg);text-align:left;padding:9px 12px;border-radius:8px;font:300 18px/1.4 var(--han);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chats button:hover{background:var(--surface)}
#chats button[aria-current=true]{background:var(--accent-soft);color:var(--accent)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header .title{flex:1;min-width:0;font:300 18px var(--han);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu{display:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.empty{margin:auto;color:var(--muted);text-align:center;font-family:var(--han)}
.msg{max-width:90%;min-width:0}
.user{align-self:flex-end;background:var(--user);padding:10px 14px;border-radius:12px 12px 2px 12px;font:300 22px/1.5 var(--han)}
.tutor{align-self:flex-start;background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:12px 12px 12px 2px}
.zh{font:300 24px/1.5 var(--han);display:flex;gap:8px;align-items:flex-start}
.zh button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:50%;width:28px;height:28px;flex:none;cursor:pointer;margin-top:3px}
.rest{white-space:pre-wrap;margin-top:4px;font-family:var(--body),var(--han)}
.rest .en{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:300 18px var(--han);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px}
.times{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.error{color:#c0392b}
form{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
form>div{display:flex;gap:8px;max-width:760px;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:300 20px/1.4 var(--han);background:var(--bg);color:var(--fg);height:52px}
form button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 18px;font:600 15px var(--body);cursor:pointer}
form button:disabled{opacity:.5;cursor:default}
@media (max-width:700px){
  aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .15s}
  body.side-open aside{transform:none}
  #menu{display:block}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<aside aria-label="Chats">
  <div class="top">
    <h1>中文 tutor</h1>
    <button id="newchat" type="button">+ New chat</button>
  </div>
  <ul id="chats"></ul>
</aside>
<div class="main">
  <header>
    <button id="menu" type="button" aria-label="Show chats">☰</button>
    <div class="title" id="title"></div>
    <div class="seg" role="group" aria-label="Text size">
      <button type="button" id="smaller" aria-label="Smaller text">A−</button>
      <button type="button" id="bigger" aria-label="Bigger text">A+</button>
    </div>
    <div class="seg" id="models" role="group" aria-label="Model"></div>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="form"><div>
    <textarea id="input" placeholder="说点什么… (Enter to send)" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </div></form>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const post = (path, body = {}) => fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
async function errorOf(res) { try { return (await res.json()).error || res.statusText; } catch { return res.statusText; } }
let state = null;

function add(cls, html) {
  log.querySelector('.empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.innerHTML = html;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function renderTutor(el, text) {
  const lines = text.replace(/^\s+/, '').split('\n');
  const zh = (lines[0] || '').replace(/\*/g, '');
  const en = lines[1] || '';
  const rest = lines.slice(2).join('\n').replace(/^\n+/, '');
  el.querySelector('.zh span').textContent = zh;
  el.querySelector('.rest').innerHTML = (en ? '<span class="en">' + bold(en) + '</span>' : '') + (rest ? '\n' + bold(rest) : '');
}

function showChips(el, chars) {
  el.querySelector('.chips').innerHTML = (chars || []).map(c => '<span class="chip">新 ' + esc(c) + '</span>').join('');
}

function showTimes(el, t) {
  if (!t) return;
  const sound = t.first_sound ? 'first sound ' + t.first_sound.toFixed(1) + ' s' : t.sound_failed ? 'no sound' : '';
  const reply = t.reply_done ? 'reply ' + t.reply_done.toFixed(1) + ' s' : '';
  el.querySelector('.times').textContent = [sound, reply].filter(Boolean).join(' · ');
}

function tutorBubble(text = '', entry = {}) {
  const el = add('tutor', '<div class="zh"><button type="button" aria-label="Play again">▶</button><span></span></div><div class="rest"></div><div class="chips"></div><div class="times"></div>');
  el.querySelector('.zh button').onclick = () => {
    const line = el.querySelector('.zh span').textContent.trim();
    if (line) post('/api/replay', {text: line});
  };
  renderTutor(el, text);
  showChips(el, entry.new);
  showTimes(el, entry.times);
  return el;
}

function renderSidebar() {
  const current = state.chats.find(c => c.id === state.current);
  document.getElementById('title').textContent = current ? current.title : '';
  document.getElementById('chats').innerHTML = state.chats.map(c =>
    `<li><button type="button" data-id="${esc(c.id)}" aria-current="${c.id === state.current}" title="${esc(c.title)}">${esc(c.title)}</button></li>`).join('');
  document.querySelectorAll('#chats button').forEach(b => b.onclick = () => openChat(b.dataset.id));
}

function render(next) {
  state = next;
  renderSidebar();
  setModels();
  log.innerHTML = '';
  for (const h of state.history) {
    if (h.role === 'user') add('user', esc(h.text));
    else if (h.role === 'tutor') tutorBubble(h.text, h);
  }
  if (!state.history.length) log.innerHTML = '<div class="empty">用中文说点什么吧。<br>Say something in Chinese to start.</div>';
  input.focus();
}

function setModels() {
  const box = document.getElementById('models');
  box.innerHTML = state.models.map(m => `<button type="button" aria-pressed="${m === state.model}" data-m="${m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = async () => {
    if (b.dataset.m === state.model) return;
    b.textContent = '…';
    const res = await post('/api/model', {model: b.dataset.m});
    if (res.ok) state.model = (await res.json()).model;
    else add('tutor error', esc(await errorOf(res)));
    setModels();
  });
}

async function call(path, body) {
  document.body.classList.remove('side-open');
  const res = await post(path, body);
  if (res.ok) render(await res.json());
  else add('tutor error', esc(await errorOf(res)));
}
const openChat = id => id !== state.current && call('/api/open', {id});
document.getElementById('newchat').onclick = () => call('/api/new');
document.getElementById('menu').onclick = () => document.body.classList.toggle('side-open');

async function send(text) {
  add('user', esc(text));
  const el = tutorBubble();
  sendBtn.disabled = true;
  let reply = '';
  let newChars = [];
  try {
    const res = await post('/api/send', {text});
    if (!res.ok) throw new Error(await errorOf(res));
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const ev = JSON.parse(buf.slice(0, i));
        buf = buf.slice(i + 1);
        if (ev.t === 'text') { reply += ev.d; renderTutor(el, reply); log.scrollTop = log.scrollHeight; }
        else if (ev.t === 'chat') {
          const chat = state.chats.find(c => c.id === ev.id);
          if (chat) { chat.title = ev.title; state.chats = [chat, ...state.chats.filter(c => c !== chat)]; }
          renderSidebar();
        }
        else if (ev.t === 'new') { showChips(el, ev.chars); newChars = ev.chars; }
        else if (ev.t === 'done') {
          showTimes(el, ev.times);
          state.history.push({role: 'user', text}, {role: 'tutor', text: reply, new: newChars, times: ev.times});
        }
        else if (ev.t === 'error') el.querySelector('.rest').innerHTML = '<span class="error">' + esc(ev.message) + '</span>';
      }
    }
  } catch (e) {
    el.querySelector('.rest').innerHTML = '<span class="error">' + esc(String(e.message || e)) + '</span>';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = '';
  send(text);
};
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); document.getElementById('form').requestSubmit(); }
});
let zoom = 0.9;
try { zoom = Number(localStorage.getItem('zoom')) || zoom; } catch {}
function applyZoom(next) {
  zoom = Math.min(2.5, Math.max(0.8, Math.round(next * 10) / 10));
  document.documentElement.style.zoom = zoom;
  try { localStorage.setItem('zoom', String(zoom)); } catch {}
}
document.getElementById('smaller').onclick = () => applyZoom(zoom - 0.1);
document.getElementById('bigger').onclick = () => applyZoom(zoom + 0.1);
applyZoom(zoom);
fetch('/api/state').then(r => r.json()).then(render);
</script>
</body>
</html>
