<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中文 Tutor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{--bg:#f5f7f6;--surface:#fff;--fg:#1b2422;--muted:#62716d;--line:#d8e1de;--accent:#16786a;--accent-soft:#e1f1ed;--user:#e9eef6;--han:"Noto Sans SC","Microsoft YaHei",sans-serif;--body:"Inter",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101615;--surface:#172020;--fg:#e3ebe9;--muted:#93a39f;--line:#2b3936;--accent:#5cc4b2;--accent-soft:#1c332e;--user:#1d2633;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font:500 17px var(--han);margin:0;flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
button.plain{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.msg{max-width:90%;min-width:0}
.user{align-self:flex-end;background:var(--user);padding:8px 12px;border-radius:12px 12px 2px 12px;font-family:var(--han)}
.tutor{align-self:flex-start;background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:12px 12px 12px 2px}
.zh{font:500 20px/1.5 var(--han);display:flex;gap:8px;align-items:flex-start}
.zh button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:50%;width:28px;height:28px;flex:none;cursor:pointer;margin-top:3px}
.rest{white-space:pre-wrap;color:var(--fg);margin-top:4px;font-family:var(--body),var(--han)}
.rest .en{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:500 14px var(--han);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px}
.times{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.divider{align-self:center;font-size:12px;color:var(--muted)}
.error{color:#c0392b}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
form>div{display:flex;gap:8px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:16px/1.4 var(--han);background:var(--bg);color:var(--fg);height:44px}
form button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 18px;font:600 15px var(--body);cursor:pointer}
form button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <h1>中文 tutor</h1>
  <div class="seg" id="models" role="group" aria-label="Model"></div>
  <button class="plain" id="new" type="button">New chat</button>
</header>
<main id="log" aria-live="polite"></main>
<form id="form"><div>
  <textarea id="input" placeholder="说点什么… (Enter to send)" aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</div></form>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

function add(cls, html) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.innerHTML = html;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function renderTutor(el, text) {
  const lines = text.replace(/^\s+/, '').split('\n');
  const zh = (lines[0] || '').replace(/\*/g, '');
  const en = lines[1] || '';
  const rest = lines.slice(2).join('\n').replace(/^\n+/, '');
  el.querySelector('.zh span').textContent = zh;
  el.querySelector('.rest').innerHTML = (en ? '<span class="en">' + bold(en) + '</span>' : '') + (rest ? '\n' + bold(rest) : '');
}

function tutorBubble(text = '') {
  const el = add('tutor', '<div class="zh"><button type="button" aria-label="Play again">▶</button><span></span></div><div class="rest"></div><div class="chips"></div><div class="times"></div>');
  el.querySelector('.zh button').onclick = () => {
    const line = el.querySelector('.zh span').textContent.trim();
    if (line) fetch('/api/replay', {method:'POST', body: JSON.stringify({text: line})});
  };
  renderTutor(el, text);
  return el;
}

function chips(el, chars) {
  el.querySelector('.chips').innerHTML = chars.map(c => '<span class="chip">新 ' + esc(c) + '</span>').join('');
}

async function load() {
  const state = await (await fetch('/api/state')).json();
  setModels(state.models, state.model);
  for (const h of state.history) {
    if (h.role === 'user') add('user', esc(h.text));
    else if (h.role === 'tutor') tutorBubble(h.text);
    else if (h.role === 'divider') add('divider', 'New chat');
  }
  input.focus();
}

function setModels(models, current) {
  const box = document.getElementById('models');
  box.innerHTML = models.map(m => `<button type="button" aria-pressed="${m === current}" data-m="${m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = async () => {
    b.textContent = '…';
    const r = await (await fetch('/api/model', {method:'POST', body: JSON.stringify({model: b.dataset.m})})).json();
    setModels(models, r.model);
  });
}

document.getElementById('new').onclick = async () => {
  await fetch('/api/new', {method:'POST'});
  add('divider', 'New chat');
};

async function send(text) {
  add('user', esc(text));
  const el = tutorBubble();
  sendBtn.disabled = true;
  let reply = '';
  try {
    const res = await fetch('/api/send', {method:'POST', body: JSON.stringify({text})});
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const ev = JSON.parse(buf.slice(0, i));
        buf = buf.slice(i + 1);
        if (ev.t === 'text') { reply += ev.d; renderTutor(el, reply); log.scrollTop = log.scrollHeight; }
        else if (ev.t === 'new') chips(el, ev.chars);
        else if (ev.t === 'done') {
          const t = ev.times;
          el.querySelector('.times').textContent = [t.first_sound && 'sound ' + t.first_sound + ' s', t.reply_done && 'reply ' + t.reply_done + ' s'].filter(Boolean).join(' · ');
        } else if (ev.t === 'error') el.querySelector('.rest').innerHTML = '<span class="error">' + esc(ev.message) + '</span>';
      }
    }
  } catch (e) {
    el.querySelector('.rest').innerHTML = '<span class="error">' + esc(String(e)) + '</span>';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = '';
  send(text);
};
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.getElementById('form').requestSubmit(); }
});
load();
</script>
</body>
</html>
