<script>
(function() {
    var toneMap = {
        'ā':1,'á':2,'ǎ':3,'à':4,
        'ē':1,'é':2,'ě':3,'è':4,
        'ī':1,'í':2,'ǐ':3,'ì':4,
        'ō':1,'ó':2,'ǒ':3,'ò':4,
        'ū':1,'ú':2,'ǔ':3,'ù':4,
        'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4
    };

    function getPinyinTone(s) {
        for (var i = 0; i < s.length; i++) {
            if (toneMap[s[i]]) return toneMap[s[i]];
        }
        return 5;
    }

    function getJyutpingTone(s) {
        var m = s.match(/(\d)$/);
        return m ? parseInt(m[1]) : 5;
    }

    // Map jyutping tones 1-6 to our 5 CSS tone classes
    function jyutpingToneClass(t) {
        if (t <= 4) return t;
        if (t === 5) return 2;  // low rising → rising color
        if (t === 6) return 4;  // low level → falling color
        return 5;
    }

    document.querySelectorAll('.pinyin').forEach(function(el) {
        el.className += ' tone' + getPinyinTone(el.textContent);
    });

    document.querySelectorAll('.jyutping').forEach(function(el) {
        el.className += ' tone' + jyutpingToneClass(getJyutpingTone(el.textContent));
    });

    // Click-to-play Cantonese audio — filename derived from Hanzi + Jyutping
    // to avoid [sound:] tags that Anki would auto-play
    document.querySelectorAll('.play-cantonese').forEach(function(btn) {
        var container = btn.closest('.pronunciations');
        if (!container) return;
        var hanziEl = container.closest('.hero');
        if (!hanziEl) return;
        var hanzi = hanziEl.querySelector('.hanzi');
        var jyutping = container.querySelector('.jyutping');
        if (!hanzi || !jyutping) { btn.style.display = 'none'; return; }
        var h = hanzi.textContent.trim();
        var j = jyutping.textContent.trim().replace(/\s+/g, '_');
        if (!h || !j) { btn.style.display = 'none'; return; }
        var file = 'yue_' + h + '_' + j + '.mp3';
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            new Audio(file).play();
        });
    });
})();
</script>
